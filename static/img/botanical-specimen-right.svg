<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 1200" width="100%" height="100%" preserveAspectRatio="xMaxYMin meet">
  <defs>
    <!-- Ginkgo Leaf -->
    <g id="br-ginkgo">
      <path d="M0 0 C 3 -18 14 -36 38 -42 C 46 -45 52 -38 50 -30 C 46 -16 30 -8 10 -3 M 0 0 C -3 -18 -14 -36 -38 -42 C -46 -45 -52 -38 -50 -30 C -46 -16 -30 -8 -10 -3" fill="none" stroke="currentColor" stroke-width="0.9"/>
      <path d="M-50 -30 C -32 -52 0 -55 0 -40 C 0 -55 32 -52 50 -30" fill="none" stroke="currentColor" stroke-width="0.9"/>
      <path d="M0 0 Q -12 -28 -32 -40 M 0 0 Q -6 -30 -16 -44 M 0 0 Q 6 -30 16 -44 M 0 0 Q 12 -28 32 -40" fill="none" stroke="currentColor" stroke-width="0.45" stroke-opacity="0.6"/>
    </g>
  </defs>

  <g color="#2e4d35" stroke-linecap="round" stroke-linejoin="round" opacity="0.75">
    <!-- Top-Right: Monstera Deliciosa Specimen Sheet -->
    <g transform="translate(320, 40) rotate(-8)">
      <path d="M 0 0 C -30 90 -60 210 -80 340" fill="none" stroke="currentColor" stroke-width="2.6"/>

      <!-- Monstera Blade -->
      <g transform="translate(0, 0) rotate(16)">
        <path d="M 0 0 Q 55 110 90 250" fill="none" stroke="currentColor" stroke-width="2.2"/>

        <!-- Left Fenestrated Half -->
        <path d="M 0 0
                 C -28 -16 -65 -8 -92 20
                 C -80 36 -55 40 -24 32
                 C -68 56 -105 76 -116 112
                 C -100 124 -72 118 -36 100
                 C -76 132 -112 168 -104 204
                 C -88 212 -60 192 -28 164
                 C -56 196 -76 236 -60 264
                 C -44 268 -24 240 0 204
                 L 90 250"
              fill="none" stroke="currentColor" stroke-width="1.3"/>

        <!-- Right Lobed Half -->
        <path d="M 0 0
                 C 36 -24 80 -16 108 12
                 C 92 30 64 34 32 28
                 C 84 48 128 68 144 104
                 C 124 116 92 110 48 92
                 C 96 124 136 156 132 196
                 C 112 204 80 184 40 156
                 C 72 188 96 228 76 256
                 C 60 260 36 232 16 200
                 L 90 250"
              fill="none" stroke="currentColor" stroke-width="1.3"/>

        <!-- Fenestrations (perforations) -->
        <ellipse cx="-16" cy="68" rx="6.5" ry="17" transform="rotate(-26 -16 68)" fill="none" stroke="currentColor" stroke-width="0.95"/>
        <ellipse cx="22" cy="60" rx="6" ry="14" transform="rotate(30 22 60)" fill="none" stroke="currentColor" stroke-width="0.95"/>
        <ellipse cx="-12" cy="132" rx="7.5" ry="20" transform="rotate(-22 -12 132)" fill="none" stroke="currentColor" stroke-width="0.95"/>
        <ellipse cx="26" cy="124" rx="6.5" ry="17" transform="rotate(24 26 124)" fill="none" stroke="currentColor" stroke-width="0.95"/>

        <!-- Main lateral veins -->
        <path d="M 0 12 Q -48 12 -92 20" fill="none" stroke="currentColor" stroke-width="0.75"/>
        <path d="M 0 16 Q 48 8 -108 12" fill="none" stroke="currentColor" stroke-width="0.75"/>
        <path d="M 14 52 Q -48 72 -116 112" fill="none" stroke="currentColor" stroke-width="0.75"/>
        <path d="M 18 56 Q 72 72 144 104" fill="none" stroke="currentColor" stroke-width="0.75"/>
        <path d="M 36 112 Q -40 140 -104 204" fill="none" stroke="currentColor" stroke-width="0.75"/>
        <path d="M 42 116 Q 80 140 132 196" fill="none" stroke="currentColor" stroke-width="0.75"/>
      </g>
    </g>

    <!-- Mid-Right: Ginkgo Biloba Branch -->
    <g transform="translate(380, 480)">
      <path d="M 80 0 C 40 30 20 80 0 145 C -18 200 -40 260 -55 330" fill="none" stroke="#5a4229" stroke-width="2.2"/>

      <!-- Cluster 1 -->
      <g transform="translate(35, 55)">
        <path d="M 0 0 C -20 -15 -50 -25 -80 -30" fill="none" stroke="currentColor" stroke-width="1"/>
        <g transform="translate(-80, -30) rotate(-38) scale(0.8)"><use href="#br-ginkgo"/></g>
        <path d="M 0 0 C -15 8 -45 12 -70 8" fill="none" stroke="currentColor" stroke-width="0.9"/>
        <g transform="translate(-70, 8) rotate(12) scale(0.68)"><use href="#br-ginkgo"/></g>
      </g>

      <!-- Cluster 2 -->
      <g transform="translate(5, 135)">
        <path d="M 0 0 C -28 -12 -60 -20 -100 -16" fill="none" stroke="currentColor" stroke-width="1.1"/>
        <g transform="translate(-100, -16) rotate(-20) scale(0.95)"><use href="#br-ginkgo"/></g>
        <path d="M 0 0 C -24 20 -52 36 -90 44" fill="none" stroke="currentColor" stroke-width="0.9"/>
        <g transform="translate(-90, 44) rotate(42) scale(0.75)"><use href="#br-ginkgo"/></g>
      </g>

      <!-- Cluster 3 -->
      <g transform="translate(-25, 230)">
        <path d="M 0 0 C -32 -8 -65 -8 -105 4" fill="none" stroke="currentColor" stroke-width="1"/>
        <g transform="translate(-105, 4) rotate(10) scale(0.85)"><use href="#br-ginkgo"/></g>
      </g>
    </g>

    <!-- Lower-Right: Lavender Sprigs, Poppy Pod & Winged Seed -->
    <g transform="translate(240, 840)">
      <path d="M 20 260 C 15 170 5 90 -12 0" fill="none" stroke="currentColor" stroke-width="1.3"/>
      <path d="M 45 260 C 55 180 65 95 58 15" fill="none" stroke="currentColor" stroke-width="1.2"/>

      <!-- Spike 1 -->
      <g transform="translate(-12, 0) rotate(-5)">
        <line x1="0" y1="0" x2="0" y2="-75" stroke="currentColor" stroke-width="0.9"/>
        <ellipse cx="0" cy="-10" rx="8" ry="3.2" fill="none" stroke="currentColor" stroke-width="0.75"/>
        <ellipse cx="0" cy="-22" rx="7.5" ry="3" fill="none" stroke="currentColor" stroke-width="0.75"/>
        <ellipse cx="0" cy="-35" rx="7" ry="2.6" fill="none" stroke="currentColor" stroke-width="0.75"/>
        <ellipse cx="0" cy="-48" rx="6" ry="2.2" fill="none" stroke="currentColor" stroke-width="0.75"/>
        <ellipse cx="0" cy="-60" rx="4.8" ry="1.8" fill="none" stroke="currentColor" stroke-width="0.75"/>
      </g>

      <!-- Spike 2 -->
      <g transform="translate(58, 15) rotate(4)">
        <line x1="0" y1="0" x2="0" y2="-65" stroke="currentColor" stroke-width="0.9"/>
        <ellipse cx="0" cy="-8" rx="7.5" ry="3" fill="none" stroke="currentColor" stroke-width="0.7"/>
        <ellipse cx="0" cy="-20" rx="7" ry="2.6" fill="none" stroke="currentColor" stroke-width="0.7"/>
        <ellipse cx="0" cy="-32" rx="6" ry="2.4" fill="none" stroke="currentColor" stroke-width="0.7"/>
        <ellipse cx="0" cy="-44" rx="5" ry="2" fill="none" stroke="currentColor" stroke-width="0.7"/>
      </g>

      <!-- Poppy Capsule Seed Pod -->
      <g transform="translate(130, 100)">
        <path d="M 0 0 C -10 0 -16 -12 -15 -28 C -12 -38 -6 -44 0 -44 C 6 -44 12 -38 15 -28 C 16 -12 10 0 0 0 Z" fill="none" stroke="currentColor" stroke-width="0.95"/>
        <line x1="0" y1="0" x2="0" y2="35" stroke="currentColor" stroke-width="1.1"/>
        <ellipse cx="0" cy="-44" rx="11" ry="3.2" fill="none" stroke="currentColor" stroke-width="0.85"/>
        <path d="M -8 -44 l 3 -2.5 M -4 -44 l 1.5 -3.2 M 0 -44 l 0 -3.8 M 4 -44 l -1.5 -3.2 M 8 -44 l -3 -2.5" stroke="currentColor" stroke-width="0.7"/>
      </g>

      <!-- Winged Maple Samara -->
      <g transform="translate(165, 30) rotate(-32)">
        <circle cx="0" cy="0" r="3.8" fill="none" stroke="currentColor" stroke-width="0.8"/>
        <path d="M 3 0 C 14 -3 34 -14 52 -18 C 55 -11 44 2 24 5 C 11 6 3 3 0 0" fill="none" stroke="currentColor" stroke-width="0.75"/>
      </g>
    </g>
  </g>
</svg>
