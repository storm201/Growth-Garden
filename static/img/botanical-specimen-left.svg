<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 1200" width="100%" height="100%" preserveAspectRatio="xMinYMin meet">
  <defs>
    <!-- Leaflet template -->
    <g id="bl-leaflet">
      <path d="M0 0 C 6 -10 22 -12 32 -3 C 22 5 8 5 0 0 Z" fill="none" stroke="currentColor" stroke-width="0.85"/>
      <line x1="0" y1="0" x2="30" y2="-3" stroke="currentColor" stroke-width="0.5"/>
    </g>
    <!-- Fern Pinnule -->
    <g id="bl-pinnule">
      <path d="M0 0 C 4 -7 16 -8 24 -2 C 16 3 6 3 0 0 Z" fill="none" stroke="currentColor" stroke-width="0.75"/>
      <circle cx="10" cy="-2" r="0.9" fill="currentColor" opacity="0.6"/>
    </g>
  </defs>

  <g color="#2c4b33" stroke-linecap="round" stroke-linejoin="round" opacity="0.75">
    <!-- Top-Left Large Arching Fern (Polypodiopsida) -->
    <g transform="translate(10, 20) rotate(12)">
      <!-- Main Stipe & Rachis -->
      <path d="M 20 10 Q 90 140 160 320 Q 200 460 220 620" fill="none" stroke="currentColor" stroke-width="2.4"/>
      <!-- Fiddlehead / Circinate Apex -->
      <path d="M 20 10 C 12 4 4 10 8 20 C 12 28 24 24 22 16 C 20 12 14 14 16 18" fill="none" stroke="currentColor" stroke-width="1.6"/>

      <!-- Fern Pinnae pairs -->
      <!-- Tier 1 -->
      <g transform="translate(45, 60) rotate(-35)">
        <path d="M 0 0 Q 40 -20 80 -10" fill="none" stroke="currentColor" stroke-width="0.9"/>
        <use href="#bl-pinnule" transform="translate(15,-6) rotate(-20) scale(0.8)"/>
        <use href="#bl-pinnule" transform="translate(35,-12) rotate(-15) scale(0.85)"/>
        <use href="#bl-pinnule" transform="translate(55,-13) rotate(-10) scale(0.8)"/>
      </g>
      <g transform="translate(55, 75) rotate(38)">
        <path d="M 0 0 Q 40 -20 80 -10" fill="none" stroke="currentColor" stroke-width="0.9"/>
        <use href="#bl-pinnule" transform="translate(15,-6) rotate(-20) scale(0.8)"/>
        <use href="#bl-pinnule" transform="translate(35,-12) rotate(-15) scale(0.85)"/>
        <use href="#bl-pinnule" transform="translate(55,-13) rotate(-10) scale(0.8)"/>
      </g>

      <!-- Tier 2 -->
      <g transform="translate(85, 135) rotate(-42)">
        <path d="M 0 0 Q 60 -28 125 -14" fill="none" stroke="currentColor" stroke-width="1.1"/>
        <use href="#bl-pinnule" transform="translate(20,-8) rotate(-22) scale(0.9)"/>
        <use href="#bl-pinnule" transform="translate(45,-18) rotate(-18) scale(1)"/>
        <use href="#bl-pinnule" transform="translate(72,-22) rotate(-12) scale(1)"/>
        <use href="#bl-pinnule" transform="translate(98,-19) rotate(-6) scale(0.9)"/>
      </g>
      <g transform="translate(98, 155) rotate(42)">
        <path d="M 0 0 Q 60 -28 125 -14" fill="none" stroke="currentColor" stroke-width="1.1"/>
        <use href="#bl-pinnule" transform="translate(20,-8) rotate(-22) scale(0.9)"/>
        <use href="#bl-pinnule" transform="translate(45,-18) rotate(-18) scale(1)"/>
        <use href="#bl-pinnule" transform="translate(72,-22) rotate(-12) scale(1)"/>
        <use href="#bl-pinnule" transform="translate(98,-19) rotate(-6) scale(0.9)"/>
      </g>

      <!-- Tier 3 -->
      <g transform="translate(125, 230) rotate(-48)">
        <path d="M 0 0 Q 80 -35 160 -18" fill="none" stroke="currentColor" stroke-width="1.3"/>
        <use href="#bl-pinnule" transform="translate(25,-10) rotate(-24) scale(1.1)"/>
        <use href="#bl-pinnule" transform="translate(55,-22) rotate(-20) scale(1.2)"/>
        <use href="#bl-pinnule" transform="translate(90,-28) rotate(-14) scale(1.2)"/>
        <use href="#bl-pinnule" transform="translate(125,-26) rotate(-8) scale(1.1)"/>
      </g>
      <g transform="translate(138, 255) rotate(46)">
        <path d="M 0 0 Q 80 -35 160 -18" fill="none" stroke="currentColor" stroke-width="1.3"/>
        <use href="#bl-pinnule" transform="translate(25,-10) rotate(-24) scale(1.1)"/>
        <use href="#bl-pinnule" transform="translate(55,-22) rotate(-20) scale(1.2)"/>
        <use href="#bl-pinnule" transform="translate(90,-28) rotate(-14) scale(1.2)"/>
        <use href="#bl-pinnule" transform="translate(125,-26) rotate(-8) scale(1.1)"/>
      </g>

      <!-- Tier 4 -->
      <g transform="translate(165, 340) rotate(-52)">
        <path d="M 0 0 Q 90 -40 185 -20" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <use href="#bl-pinnule" transform="translate(30,-12) rotate(-26) scale(1.2)"/>
        <use href="#bl-pinnule" transform="translate(68,-26) rotate(-20) scale(1.3)"/>
        <use href="#bl-pinnule" transform="translate(108,-34) rotate(-14) scale(1.3)"/>
        <use href="#bl-pinnule" transform="translate(148,-30) rotate(-8) scale(1.2)"/>
      </g>
      <g transform="translate(180, 368) rotate(48)">
        <path d="M 0 0 Q 90 -40 185 -20" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <use href="#bl-pinnule" transform="translate(30,-12) rotate(-26) scale(1.2)"/>
        <use href="#bl-pinnule" transform="translate(68,-26) rotate(-20) scale(1.3)"/>
        <use href="#bl-pinnule" transform="translate(108,-34) rotate(-14) scale(1.3)"/>
        <use href="#bl-pinnule" transform="translate(148,-30) rotate(-8) scale(1.2)"/>
      </g>
    </g>

    <!-- Mid-Left: Climbing Hedera Helix Vine -->
    <g transform="translate(35, 480)">
      <path d="M 10 0 C -15 60 25 130 5 200 C -15 270 30 340 10 410 C -8 470 20 530 12 590" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <!-- Tendrils -->
      <path d="M 8 160 C 35 150 48 168 40 180 C 32 192 18 185 24 175" fill="none" stroke="currentColor" stroke-width="0.8"/>
      <path d="M 12 320 C 45 310 58 332 46 345 C 36 355 24 345 30 338" fill="none" stroke="currentColor" stroke-width="0.8"/>

      <!-- Ivy 5-lobed leaves with veins -->
      <g transform="translate(25, 70) rotate(32)">
        <path d="M0 0 C -8 -4 -20 -3 -26 -12 C -24 -20 -12 -22 -10 -30 C -6 -40 0 -48 0 -48 C 0 -48 6 -40 10 -30 C 12 -22 24 -20 26 -12 C 20 -3 8 -4 0 0 Z" fill="none" stroke="currentColor" stroke-width="0.85"/>
        <line x1="0" y1="0" x2="0" y2="-46" stroke="currentColor" stroke-width="0.5"/>
        <line x1="0" y1="-8" x2="-24" y2="-12" stroke="currentColor" stroke-width="0.45"/>
        <line x1="0" y1="-8" x2="24" y2="-12" stroke="currentColor" stroke-width="0.45"/>
      </g>

      <g transform="translate(-2, 145) rotate(-55) scale(0.9)">
        <path d="M0 0 C -8 -4 -20 -3 -26 -12 C -24 -20 -12 -22 -10 -30 C -6 -40 0 -48 0 -48 C 0 -48 6 -40 10 -30 C 12 -22 24 -20 26 -12 C 20 -3 8 -4 0 0 Z" fill="none" stroke="currentColor" stroke-width="0.85"/>
        <line x1="0" y1="0" x2="0" y2="-46" stroke="currentColor" stroke-width="0.5"/>
        <line x1="0" y1="-8" x2="-24" y2="-12" stroke="currentColor" stroke-width="0.45"/>
        <line x1="0" y1="-8" x2="24" y2="-12" stroke="currentColor" stroke-width="0.45"/>
      </g>

      <g transform="translate(30, 220) rotate(42) scale(1.1)">
        <path d="M0 0 C -8 -4 -20 -3 -26 -12 C -24 -20 -12 -22 -10 -30 C -6 -40 0 -48 0 -48 C 0 -48 6 -40 10 -30 C 12 -22 24 -20 26 -12 C 20 -3 8 -4 0 0 Z" fill="none" stroke="currentColor" stroke-width="0.85"/>
        <line x1="0" y1="0" x2="0" y2="-46" stroke="currentColor" stroke-width="0.5"/>
        <line x1="0" y1="-8" x2="-24" y2="-12" stroke="currentColor" stroke-width="0.45"/>
        <line x1="0" y1="-8" x2="24" y2="-12" stroke="currentColor" stroke-width="0.45"/>
      </g>

      <g transform="translate(-4, 300) rotate(-48) scale(0.85)">
        <path d="M0 0 C -8 -4 -20 -3 -26 -12 C -24 -20 -12 -22 -10 -30 C -6 -40 0 -48 0 -48 C 0 -48 6 -40 10 -30 C 12 -22 24 -20 26 -12 C 20 -3 8 -4 0 0 Z" fill="none" stroke="currentColor" stroke-width="0.85"/>
      </g>

      <g transform="translate(24, 380) rotate(35) scale(1)">
        <path d="M0 0 C -8 -4 -20 -3 -26 -12 C -24 -20 -12 -22 -10 -30 C -6 -40 0 -48 0 -48 C 0 -48 6 -40 10 -30 C 12 -22 24 -20 26 -12 C 20 -3 8 -4 0 0 Z" fill="none" stroke="currentColor" stroke-width="0.85"/>
      </g>
    </g>

    <!-- Lower-Left: Wild Grasses, Awns & Clover -->
    <g transform="translate(120, 860)">
      <path d="M 0 320 C 15 220 20 120 -10 0" fill="none" stroke="currentColor" stroke-width="1.4"/>
      <path d="M 25 320 C 45 200 65 100 45 -25" fill="none" stroke="currentColor" stroke-width="1.3"/>
      <!-- Spikelets -->
      <g transform="translate(-10, 0) rotate(-14)">
        <line x1="0" y1="0" x2="0" y2="-60" stroke="currentColor" stroke-width="0.9"/>
        <path d="M 0 -8 l -6 -6 M 0 -8 l 6 -6 M 0 -20 l -7 -7 M 0 -20 l 7 -7 M 0 -34 l -7 -7 M 0 -34 l 7 -7 M 0 -48 l -5 -5 M 0 -48 l 5 -5" stroke="currentColor" stroke-width="0.75"/>
        <line x1="-7" y1="-27" x2="-18" y2="-44" stroke="currentColor" stroke-width="0.4"/>
        <line x1="7" y1="-27" x2="18" y2="-44" stroke="currentColor" stroke-width="0.4"/>
      </g>

      <!-- Clover sprig -->
      <g transform="translate(60, 180)">
        <path d="M 0 0 C -10 -15 -25 -25 -35 -45" fill="none" stroke="currentColor" stroke-width="1"/>
        <g transform="translate(-35, -45) scale(0.7)">
          <path d="M0 0 C -10 -14 -16 -28 -5 -36 C 3 -40 10 -32 0 -20 C -10 -32 -3 -40 5 -36 C 16 -28 10 -14 0 0 Z" fill="none" stroke="currentColor" stroke-width="0.9"/>
        </g>
        <path d="M 0 0 C 12 -12 25 -22 40 -38" fill="none" stroke="currentColor" stroke-width="1"/>
        <g transform="translate(40, -38) rotate(35) scale(0.65)">
          <path d="M0 0 C -10 -14 -16 -28 -5 -36 C 3 -40 10 -32 0 -20 C -10 -32 -3 -40 5 -36 C 16 -28 10 -14 0 0 Z" fill="none" stroke="currentColor" stroke-width="0.9"/>
        </g>
      </g>
    </g>
  </g>
</svg>
